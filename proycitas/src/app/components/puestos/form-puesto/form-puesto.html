<p>form-puesto works!</p>
<div class="container mt-4">
  <h2>{{ esEdicion ? 'Editar' : 'Nuevo' }} Puesto</h2>

  <form (ngSubmit)="guardar()">

    <div class="mb-3">
      <label class="form-label">Nombre del Puesto</label>
      <input type="text" class="form-control" [(ngModel)]="puesto.nombre_puesto" name="nombre_puesto" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Estatus</label>
      <select class="form-select" [(ngModel)]="puesto.estatus" name="estatus">
        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success me-2">Guardar</button>
    <a routerLink="/puestos" class="btn btn-secondary">Cancelar</a>

  </form>
</div>

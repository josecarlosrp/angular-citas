<div class="container mt-4">
  <h2>{{ esEdicion ? 'Editar' : 'Nuevo' }} Tipo de Examen</h2>

  <form (ngSubmit)="guardar()">
    <div class="mb-3">
      <label class="form-label">Nombre Corto</label>
      <input type="text" class="form-control" [(ngModel)]="tipoExamen.nombre_corto" name="nombre_corto" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" [(ngModel)]="tipoExamen.descripcion" name="descripcion" rows="3"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Estatus</label>
      <select class="form-select" [(ngModel)]="tipoExamen.estatus" name="estatus">
        <option [ngValue]="true">Activo</option>
        <option [ngValue]="false">Inactivo</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success me-2">Guardar</button>
    <a routerLink="/tipos-examen" class="btn btn-secondary">Cancelar</a>
  </form>
</div>

<p>form-usuario works!</p>
<div class="container mt-4">
  <h2>{{ esEdicion ? 'Editar' : 'Nuevo' }} Usuario</h2>

  <form (ngSubmit)="guardar()">
    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.nombre_completo" name="nombre_completo" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="usuario.contrasena" name="contrasena" required>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.telefono" name="telefono">
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Rol</label>
        <select class="form-select" [(ngModel)]="usuario.rol" name="rol" required>
          <option value="">-- Selecciona --</option>
          <option value="paciente">Paciente</option>
          <option value="radiologo">Radiólogo</option>
          <option value="administrativo">Administrativo</option>
          <option value="coordinador">Coordinador</option>
          <option value="administrador">Administrador</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Tipo Usuario</label>
        <select class="form-select" [(ngModel)]="usuario.tipo_usuario" name="tipo_usuario" required>
          <option value="">-- Selecciona --</option>
          <option value="Paciente">Paciente</option>
          <option value="Médico">Médico</option>
          <option value="Administrativo">Administrativo</option>
          <option value="Administrador">Administrador</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Sexo</label>
        <select class="form-select" [(ngModel)]="usuario.sexo" name="sexo">
          <option value="">-- Selecciona --</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Dependencia</label>
        <input type="text" class="form-control" [(ngModel)]="usuario.dependencia" name="dependencia">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Estatus</label>
        <select class="form-select" [(ngModel)]="usuario.estatus" name="estatus">
          <option value="A">Activo</option>
          <option value="I">Inactivo</option>
        </select>
      </div>

    </div>

    <button type="submit" class="btn btn-success me-2">Guardar</button>
    <a routerLink="/usuarios" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
